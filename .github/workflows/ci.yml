name: engineering-quality

on:
  pull_request:
  push:
    branches: [main, roadie-demo]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install dependencies
        run: npm install
      - name: Run automated domain tests
        run: npm test
      - name: Test Go recovery service
        working-directory: services/recovery-go
        run: go test ./...
      - name: Build Go recovery service
        working-directory: services/recovery-go
        run: go build ./...
      - name: Build API and web applications
        run: npm run build
